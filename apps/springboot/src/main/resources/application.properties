server.port=8080
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${POSTGRES_DB:benchmark}
spring.datasource.username=${POSTGRES_USER:benchmark}
spring.datasource.password=${POSTGRES_PASSWORD:benchmark}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=0
spring.main.banner-mode=off
logging.level.root=WARN
server.compression.enabled=false
