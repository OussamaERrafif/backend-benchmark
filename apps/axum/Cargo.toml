[package]
name = "benchmark"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
axum = "=0.8.1"
tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sqlx = { version = "=0.8.3", default-features = false, features = ["runtime-tokio", "postgres", "derive"] }

[profile.release]
opt-level = 3
